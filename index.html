<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myntra Clone</title>
  <link rel="stylesheet" href="Myntra clone.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <img src="myntraCss.png" alt="Logo">
    </div>
    <nav>
      <ul>
        <li><a href="#">Men</a></li>
        <li><a href="#">Women</a></li>
        <li><a href="#">Kids</a></li>
        <li><a href="#">Home & Living</a></li>
        <li><a href="#">Beauty</a></li>
      </ul>
    </nav>
    <div class="search-bar">
      <input type="text" placeholder="Search for products...">
    </div>
  </header>

  <!-- Banner -->
  <section class="banner">
    <img src="https://picsum.photos/1200/400?random=10" alt="Banner">
  </section>

  <!-- Featured Products -->
  <section class="products">
    <h2>Featured Products</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="https://picsum.photos/300/400?random=1" alt="Shirt">
        <h3>Casual Shirt</h3>
        <p class="price">₹799</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://picsum.photos/300/400?random=2" alt="Shoes">
        <h3>Running Shoes</h3>
        <p class="price">₹1999</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://picsum.photos/300/400?random=3" alt="Watch">
        <h3>Smart Watch</h3>
        <p class="price">₹2999</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://picsum.photos/300/400?random=4" alt="Dress">
        <h3>Summer Dress</h3>
        <p class="price">₹1499</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 Myntra Clone | Built by Shivam</p>
  </footer>
</body>
</html>
